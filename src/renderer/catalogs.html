<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Offline Medical Office — الكتالوجات</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
    .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    h2 { font-size: 1.15rem; margin: 2rem 0 0.75rem; }
    nav { margin-bottom: 1.5rem; }
    nav a { color: #2b6cb0; text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    form { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    input[type="text"] {
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
      min-width: 180px;
    }
    button {
      padding: 0.5rem 1.25rem;
      border: 1px solid #2b6cb0;
      background: #2b6cb0;
      color: #fff;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #245a94; }
    button.toggle { background: #fff; color: #2b6cb0; padding: 0.25rem 0.75rem; font-size: 0.9rem; }
    button.toggle:hover { background: #edf2f7; }
    .message { min-height: 1.5rem; margin: 0.25rem 0 1rem; font-size: 0.95rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 0.6rem 0.75rem; text-align: right; }
    th { background: #edf2f7; font-weight: 600; }
    tbody tr:nth-child(even) { background: #fafafa; }
    .inactive td { color: #888; }
    .status { font-weight: 600; }
    .status.active { color: #2f855a; }
    .status.inactive { color: #c53030; }
  </style>
</head>
<body>
  <div class="container">
    <h1>إدارة الكتالوجات</h1>
    <nav><a href="index.html">← العودة إلى إدارة المرضى</a></nav>

    <h2>شركات التأمين</h2>
    <form id="insuranceForm">
      <input type="text" id="insurance_name" placeholder="اسم الشركة" required />
      <input type="text" id="insurance_phone" placeholder="الهاتف (اختياري)" />
      <button type="submit">إضافة شركة</button>
    </form>
    <p class="message" id="insuranceMessage"></p>

    <table id="insuranceTable">
      <thead>
        <tr>
          <th>الاسم</th>
          <th>الهاتف</th>
          <th>الحالة</th>
          <th>إجراء</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>الجهات الطبية</h2>
    <form id="entityForm">
      <input type="text" id="entity_name" placeholder="اسم الجهة" required />
      <input type="text" id="entity_phone" placeholder="الهاتف (اختياري)" />
      <button type="submit">إضافة جهة</button>
    </form>
    <p class="message" id="entityMessage"></p>

    <table id="entityTable">
      <thead>
        <tr>
          <th>الاسم</th>
          <th>الهاتف</th>
          <th>الحالة</th>
          <th>إجراء</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script type="module" src="./catalogs.ts"></script>
</body>
</html>
