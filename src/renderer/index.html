<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Offline Medical Office</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
    .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    nav { margin-bottom: 1.5rem; display: flex; gap: 1rem; }
    nav a { color: #2b6cb0; text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    form { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    input[type="text"] {
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
      min-width: 180px;
    }
    button {
      padding: 0.5rem 1.25rem;
      border: 1px solid #2b6cb0;
      background: #2b6cb0;
      color: #fff;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #245a94; }
    #message { min-height: 1.5rem; margin: 0.5rem 0 1.5rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 0.6rem 0.75rem; text-align: right; }
    th { background: #edf2f7; font-weight: 600; }
    tbody tr:nth-child(even) { background: #fafafa; }
  </style>
</head>
<body>
  <div class="container">
    <h1>إدارة المرضى</h1>
    <nav>
      <a href="catalogs.html">إدارة الكتالوجات</a>
      <a href="visits.html">دخول مريض جديد (إقامة)</a>
      <a href="visits-list.html">الإقامات النشطة (البحث والمتابعة)</a>
      <a href="procedures.html">إدارة الإجراءات الطبية</a>
    </nav>
    
    <form id="patientForm">
      <input type="text" id="file_number" placeholder="رقم الملف" required />
      <input type="text" id="full_name" placeholder="الاسم الكامل" required />
      <button type="submit">حفظ المريض</button>
    </form>
    <p id="message"></p>

    <table id="patientsTable">
      <thead>
        <tr>
          <th>رقم الملف</th>
          <th>الاسم</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
