<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Offline Medical Office — تفاصيل الإقامة</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
    .container { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    h2 { font-size: 1.15rem; margin: 2rem 0 0.75rem; }
    nav { margin-bottom: 1.5rem; display: flex; gap: 1rem; }
    nav a { color: #2b6cb0; text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    .visit-card {
      background: #fff; border: 1px solid #ddd; border-radius: 6px;
      padding: 1rem 1.25rem; display: flex; flex-wrap: wrap; gap: 2rem;
    }
    .visit-card .item { display: flex; flex-direction: column; gap: 0.2rem; }
    .visit-card .label { font-size: 0.8rem; color: #666; }
    .visit-card .value { font-weight: 600; }
    .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; }
    .badge.open { background: #f0fff4; color: #2f855a; border: 1px solid #2f855a; }
    .badge.closed { background: #fff5f5; color: #c53030; border: 1px solid #c53030; }
    form { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 1.25rem; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .field { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.35rem; flex: 1; min-width: 160px; }
    .field > label { font-weight: 600; font-size: 0.9rem; }
    input[type="text"], input[type="number"], input[type="date"], select {
      padding: 0.5rem 0.75rem; border: 1px solid #ccc; border-radius: 4px;
      font-size: 1rem; font-family: inherit;
    }
    button {
      padding: 0.55rem 1.25rem; border: 1px solid #2b6cb0; background: #2b6cb0;
      color: #fff; border-radius: 4px; font-size: 1rem; cursor: pointer;
    }
    button:hover { background: #245a94; }
    button:disabled { background: #a0aec0; border-color: #a0aec0; cursor: not-allowed; }
    button.danger { background: #fff; color: #c53030; border-color: #c53030; padding: 0.25rem 0.7rem; font-size: 0.85rem; }
    button.danger:hover { background: #fff5f5; }
    #message { min-height: 1.5rem; margin: 0.75rem 0 0; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 0.55rem 0.7rem; text-align: right; font-size: 0.95rem; }
    th { background: #edf2f7; font-weight: 600; }
    tbody tr:nth-child(even) { background: #fafafa; }
    .totals {
      margin-top: 1rem; background: #fff; border: 1px solid #ddd; border-radius: 6px;
      padding: 1rem 1.25rem; display: flex; flex-wrap: wrap; gap: 2rem;
    }
    .totals .item { display: flex; flex-direction: column; gap: 0.2rem; }
    .totals .label { font-size: 0.8rem; color: #666; }
    .totals .value { font-weight: 700; font-size: 1.1rem; }
    .hidden { display: none; }
    .empty { color: #777; font-style: italic; padding: 0.75rem; }
    .discharge-bar {
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
      background: #fff; border: 1px solid #ddd; border-radius: 6px;
      padding: 1rem 1.25rem; margin-top: 1rem;
    }
    button.danger-solid { background: #c53030; border-color: #c53030; }
    button.danger-solid:hover { background: #9b2c2c; }
    #reportLink { color: #2b6cb0; font-weight: 600; text-decoration: none; }
    #reportLink:hover { text-decoration: underline; }
    #dischargeMessage { font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>تفاصيل الإقامة</h1>
    <nav>
      <a href="index.html">إدارة المرضى</a>
      <a href="visits.html">دخول مريض جديد</a>
      <a href="catalogs.html">إدارة الكتالوجات</a>
    </nav>

    <div class="visit-card" id="visitCard">
      <div class="item"><span class="label">رقم الحالة</span><span class="value" id="caseNumber">—</span></div>
      <div class="item"><span class="label">المريض</span><span class="value" id="patientName">—</span></div>
      <div class="item"><span class="label">رقم الملف</span><span class="value" id="patientFile">—</span></div>
      <div class="item"><span class="label">تاريخ الدخول</span><span class="value" id="admissionDate">—</span></div>
      <div class="item"><span class="label">الحالة</span><span class="value" id="visitStatus">—</span></div>
    </div>
    <p id="loadMessage"></p>

    <div id="dischargeBar" class="discharge-bar hidden">
      <button type="button" id="btnDischarge" class="danger-solid">تسجيل خروج</button>
      <a id="reportLink" href="#" class="hidden">عرض تقرير الخروج</a>
      <span id="dischargeMessage"></span>
    </div>

    <div id="procedureSection">
      <h2>إضافة إجراء</h2>
      <form id="procedureForm">
        <div class="row">
          <div class="field">
            <label for="procedure_id">الإجراء</label>
            <select id="procedure_id" required>
              <option value="">— اختر الإجراء —</option>
            </select>
          </div>
          <div class="field">
            <label for="quantity">الكمية</label>
            <input type="number" id="quantity" min="1" step="1" value="1" required />
          </div>
          <div class="field">
            <label for="unit_price">سعر الوحدة (قرش)</label>
            <input type="number" id="unit_price" min="0" step="1" required />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="procedure_date">تاريخ الإجراء</label>
            <input type="date" id="procedure_date" required />
          </div>
          <div class="field">
            <label for="notes">ملاحظات (اختياري)</label>
            <input type="text" id="notes" />
          </div>
        </div>

        <button type="submit" id="submitBtn">إضافة الإجراء</button>
        <p id="message"></p>
      </form>

      <h2>الإجراءات المسجلة</h2>
      <table id="proceduresTable">
        <thead>
          <tr>
            <th>الإجراء</th>
            <th>التصنيف</th>
            <th>الكمية</th>
            <th>سعر الوحدة</th>
            <th>الإجمالي</th>
            <th>التاريخ</th>
            <th>ملاحظات</th>
            <th>إجراء</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="empty hidden" id="emptyState">لا توجد إجراءات مسجلة بعد.</p>

      <div class="totals">
        <div class="item"><span class="label">الإجمالي</span><span class="value" id="totalGross">0</span></div>
        <div class="item"><span class="label">حصة المريض</span><span class="value" id="patientShare">0</span></div>
        <div class="item"><span class="label">حصة التأمين</span><span class="value" id="insurerShare">0</span></div>
      </div>
    </div>
  </div>
  <script type="module" src="./visit-details.ts"></script>
</body>
</html>
